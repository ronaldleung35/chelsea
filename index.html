<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車路士情報站 · Chelsea Blues Hub</title>
<style>
:root{--blue:#034694;--gold:#dba111;--bg:#f4f6fb;--card:#fff;--txt:#1a2233;--muted:#8a94a6;--line:#e8ecf4;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;}
header{background:linear-gradient(135deg,#034694 0%,#0a2a6b 60%,#123c8f 100%);color:#fff;padding:24px 24px 20px;position:relative;}
header .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
header .brand{display:flex;align-items:center;gap:12px;}
header .crest{font-size:36px;}
header .brand h1{font-size:22px;line-height:1.2;}
header .brand .sub{color:#c9d6f0;font-size:13px;margin-top:2px;}
.badge{background:var(--gold);color:#222;font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px;white-space:nowrap;display:inline-block;margin-top:4px;}
.wrap{max-width:1200px;margin:0 auto;padding:18px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
.tab{border:none;background:#fff;padding:7px 16px;border-radius:20px;cursor:pointer;font-size:14px;color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.tab.active{background:var(--blue);color:#fff;}
.count{color:var(--muted);font-size:13px;margin:6px 0 14px;}
/* 左右分栏：左新闻 3/4，右图集 1/4 */
.layout{display:grid;grid-template-columns:3fr 1fr;gap:18px;align-items:start;}
.news-col{display:flex;flex-direction:column;gap:14px;}
.gallery-col{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px;}
.col-title{font-size:15px;font-weight:700;color:var(--blue);padding-bottom:6px;border-bottom:2px solid var(--blue);display:flex;align-items:center;gap:6px;}
/* 新闻卡片：框型 */
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1px solid var(--line);transition:box-shadow .15s, transform .15s;}
.card:hover{box-shadow:0 6px 20px rgba(3,70,148,.14);transform:translateY(-2px);}
.card .head{display:flex;gap:14px;padding:14px;align-items:center;cursor:pointer;}
.card .head .thumb{width:110px;height:74px;object-fit:cover;border-radius:8px;background:#e5e9f2;flex-shrink:0;}
.card .head .info{flex:1;min-width:0;}
.card .meta{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px;}
.tag{font-size:10px;font-weight:700;padding:1px 8px;border-radius:9px;letter-spacing:.3px;}
.tag.article{background:#e3ecfb;color:#0a3d91;}
.tag.video{background:#fde8e8;color:#b91c1c;}
.card h3{font-size:15px;font-weight:600;line-height:1.45;color:var(--txt);}
.card .zh-title{font-size:13px;color:#0a3d91;line-height:1.5;margin-top:2px;}
.card .chev{color:var(--muted);font-size:18px;flex-shrink:0;transition:transform .2s;}
.card.open .chev{transform:rotate(90deg);}
/* 详情区：正文排版优化 */
.detail{display:none;border-top:1px solid var(--line);padding:18px 20px;background:#fbfcfe;}
.card.open .detail{display:block;}
.lang-switch{display:flex;gap:6px;margin-bottom:14px;}
.lang-switch button{border:1px solid var(--line);background:#fff;padding:4px 14px;border-radius:16px;font-size:12px;cursor:pointer;color:var(--txt);transition:all .15s;}
.lang-switch button.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.article-body{display:none;font-size:15px;line-height:2;color:#2a3242;}
.article-body.show{display:block;}
.article-body.zh{color:#1f2937;}
.article-body.en{color:#3a4356;}
.article-body p{margin-bottom:14px;}
.no-body{color:var(--muted);font-size:13px;}
/* 视频播放器 */
.video-box{margin-top:6px;}
.video-box iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:10px;background:#000;}
.video-hint{font-size:12px;color:var(--muted);margin-top:6px;}
/* 图集列 */
.gallery-card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1px solid var(--line);}
.gallery-card .head{padding:12px;cursor:pointer;}
.gallery-card .head .thumb{width:100%;height:110px;object-fit:cover;border-radius:8px;background:#e5e9f2;display:block;}
.gallery-card .head .info{padding:8px 2px 2px;}
.gallery-card h3{font-size:13px;font-weight:600;line-height:1.4;}
.gallery-card .zh-title{font-size:12px;color:#0a3d91;line-height:1.45;margin-top:2px;}
.gallery-card .meta{font-size:10px;color:var(--muted);margin-bottom:4px;}
.gallery-grid{display:none;grid-template-columns:repeat(2,1fr);gap:6px;padding:0 12px 12px;}
.gallery-card.open .gallery-grid{display:grid;}
.gallery-grid img{width:100%;border-radius:6px;background:#e5e9f2;cursor:zoom-in;aspect-ratio:1/1;object-fit:cover;}
/* 灯箱 */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:99;align-items:center;justify-content:center;flex-direction:column;}
.lightbox.show{display:flex;}
.lightbox img{max-width:92vw;max-height:84vh;border-radius:6px;}
.lightbox .lb-close{position:absolute;top:14px;right:22px;color:#fff;font-size:34px;cursor:pointer;}
.lightbox .lb-count{color:#ccc;margin-top:10px;font-size:13px;}
footer{text-align:center;color:var(--muted);font-size:12px;padding:22px;border-top:1px solid #e5e9f2;margin-top:22px;}
footer a{color:var(--blue);}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;}
  .gallery-col{position:static;}
}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">
      <div class="crest">🔵</div>
      <div>
        <h1>車路士情報站</h1>
        <div class="sub">Chelsea Blues Hub · 官方新聞 + 訓練圖集 · 中英對照</div>
      </div>
    </div>
    <div class="badge" id="updated">載入中…</div>
  </div>
</header>
<div class="wrap">
<div class="tabs" id="tabs">
  <button class="tab active" data-f="all">全部</button>
  <button class="tab" data-f="article">📰 新聞</button>
  <button class="tab" data-f="video">🎬 影片</button>
  <button class="tab" data-f="gallery">📷 圖集</button>
</div>
<div class="count" id="count"></div>
<div class="layout">
  <div class="news-col" id="news-col"></div>
  <div class="gallery-col" id="gallery-col"></div>
</div>
</div>
<footer>
數據源：chelseafc.com 官方 · 中英翻譯由免費接口提供 · 圖片版權歸車路士足球會所有，僅作個人收藏
</footer>

<div class="lightbox" id="lightbox" onclick="closeLB()">
  <span class="lb-close">×</span>
  <img id="lb-img" src="" alt="">
  <div class="lb-count" id="lb-count"></div>
</div>

<script>
let DATA = {news:[]};
let FILTER = 'all';

fetch('data/news.json')
  .then(r=>r.json())
  .then(d=>{
    DATA = d;
    // 北京时间（UTC+8）
    const t = new Date(d.updated.replace(' ','T') + (d.updated.includes('+')?'':'+08:00'));
    const bj = t.toLocaleString('zh-Hant', {timeZone:'Asia/Shanghai', hour12:false});
    document.getElementById('updated').textContent = '更新於 ' + bj + '（每5分鐘刷新）';
    render();
  })
  .catch(e=>{ document.getElementById('news-col').innerHTML = '<p>載入失敗：' + e + '</p>'; });

document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  FILTER = btn.dataset.f;
  render();
});

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// 把正文按句分段，提升可读性
function toParagraphs(text){
  if(!text) return '';
  const sentences = text.split(/(?<=[。！？.!?])\s*/);
  let html = '', buf = '';
  for(const s of sentences){
    buf += s;
    if(buf.length > 90){
      html += '<p>' + esc(buf.trim()) + '</p>';
      buf = '';
    }
  }
  if(buf.trim()) html += '<p>' + esc(buf.trim()) + '</p>';
  return html;
}

function render(){
  const newsList = DATA.news.filter(n=> n.type.toLowerCase()==='article');
  const videoList = DATA.news.filter(n=> n.type.toLowerCase()==='video');
  const galleryList = DATA.news.filter(n=> n.is_gallery);

  // 过滤
  let showNews = FILTER==='all' || FILTER==='article';
  let showVideo = FILTER==='all' || FILTER==='video';
  let showGallery = FILTER==='all' || FILTER==='gallery';

  const total = (showNews?newsList.length:0)+(showVideo?videoList.length:0)+(showGallery?galleryList.length:0);
  document.getElementById('count').textContent = `共 ${total} 條 · 點擊卡片展開全文 · 默認顯示中文`;

  // 新闻列（article + video）
  const newsCol = document.getElementById('news-col');
  let newsHtml = '';
  const mainItems = [...(showNews?newsList:[]), ...(showVideo?videoList:[])];
  mainItems.forEach((n,i)=>{
    const thumb = n.thumbnail ? `<img class="thumb" src="${esc(n.thumbnail)}" loading="lazy" alt="">` : '';
    const tag = n.type.toLowerCase()==='video' ? '<span class="tag video">🎬 影片</span>' : '<span class="tag article">📰 新聞</span>';
    const cat = n.category ? `<span>${esc(n.category)}</span>` : '';
    const zhTitle = n.title_zh ? `<div class="zh-title">${esc(n.title_zh)}</div>` : '';

    // 正文区（默认中文）
    let bodyHtml = '';
    if(n.type.toLowerCase()==='video'){
      // 视频：iframe 播放器
      if(n.video_id){
        bodyHtml = `<div class="video-box">
          <iframe src="https://cdn.jwplayer.com/players/${esc(n.video_id)}.html" allow="autoplay; fullscreen" allowfullscreen></iframe>
          <div class="video-hint">官方影片播放器 · 若無法播放請到 chelseafc.com 查看</div>
        </div>`;
      } else {
        bodyHtml = `<div class="no-body">（影片來源暫未取得）</div>`;
      }
    } else {
      if(n.body_en || n.body_zh){
        const hasBoth = n.body_en && n.body_zh;
        const switcher = hasBoth ? `<div class="lang-switch">
          <button class="active" data-langbtn="zh" onclick="setLang('${i}','zh','main')">中文</button>
          <button data-langbtn="en" onclick="setLang('${i}','en','main')">English</button>
        </div>` : '';
        const zh = n.body_zh ? `<div class="article-body zh show">${toParagraphs(n.body_zh)}</div>` : `<div class="article-body zh show"><div class="no-body">（暫無中文）</div></div>`;
        const en = n.body_en ? `<div class="article-body en">${toParagraphs(n.body_en)}</div>` : '';
        bodyHtml = switcher + zh + en;
      } else {
        bodyHtml = `<div class="no-body">（本篇僅有標題，無正文內容）</div>`;
      }
    }

    newsHtml += `<div class="card" id="main-${i}">
      <div class="head" onclick="toggle('main-${i}')">
        ${thumb}
        <div class="info">
          <div class="meta">${tag}${cat}</div>
          <h3>${esc(n.title)}</h3>
          ${zhTitle}
        </div>
        <div class="chev">▶</div>
      </div>
      <div class="detail">${bodyHtml}</div>
    </div>`;
  });
  newsCol.innerHTML = newsHtml || '<p style="color:var(--muted)">暫無內容</p>';

  // 图集列（右侧 1/4）
  const galleryCol = document.getElementById('gallery-col');
  let galleryHtml = `<div class="col-title">📷 訓練圖集</div>`;
  if(showGallery && galleryList.length){
    galleryList.forEach((n,i)=>{
      const thumb = n.thumbnail ? n.thumbnail : (n.images_local && n.images_local.length ? n.images_local[0] : '');
      const zhTitle = n.title_zh ? `<div class="zh-title">${esc(n.title_zh)}</div>` : '';
      const imgs = (n.images_local||[]).map(p=>`<img src="${esc(p)}" loading="lazy" onclick="openLB('${esc(p)}','${n.images_local.length}')" alt="">`).join('');
      galleryHtml += `<div class="gallery-card" id="gal-${i}">
        <div class="head" onclick="toggle('gal-${i}')">
          ${thumb?`<img class="thumb" src="${esc(thumb)}" loading="lazy" alt="">`:''}
          <div class="info">
            <div class="meta">📷 圖集 · ${n.images_local.length} 張</div>
            <h3>${esc(n.title)}</h3>
            ${zhTitle}
          </div>
        </div>
        <div class="gallery-grid">${imgs}</div>
      </div>`;
    });
  } else {
    galleryHtml += '<p style="color:var(--muted);font-size:13px">暫無圖集</p>';
  }
  galleryCol.innerHTML = galleryHtml;
}

function toggle(id){
  const el = document.getElementById(id);
  if(el) el.classList.toggle('open');
}

function setLang(key, lang, col){
  const prefix = col==='main' ? 'main-' : 'gal-';
  const card = document.getElementById(prefix+key);
  if(!card) return;
  const bodies = card.querySelectorAll('.article-body');
  bodies.forEach(b=>{
    b.classList.toggle('show', b.classList.contains(lang));
  });
  const btns = card.querySelectorAll('.lang-switch button');
  btns.forEach(b=>{
    b.classList.toggle('active', b.dataset.langbtn===lang);
  });
}

function openLB(src, total){
  document.getElementById('lb-img').src = src;
  document.getElementById('lb-count').textContent = '共 ' + total + ' 張，點擊任意處關閉';
  document.getElementById('lightbox').classList.add('show');
}
function closeLB(){
  document.getElementById('lightbox').classList.remove('show');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLB(); });
</script>
</body>
</html>
