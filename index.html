<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>切尔西情報站 · Chelsea Blues Hub</title>
<style>
:root{--blue:#034694;--gold:#dba111;--bg:#f4f6fb;--card:#fff;--txt:#1a2233;--muted:#8a94a6;--line:#e8ecf4;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;}
header{background:linear-gradient(135deg,#034694 0%,#0a2a6b 60%,#123c8f 100%);color:#fff;padding:20px 24px;position:relative;}
header .topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
header .brand{display:flex;align-items:center;gap:14px;}
header .crest{width:48px;height:48px;flex-shrink:0;}
header .crest img{width:100%;height:100%;object-fit:contain;}
header .brand-text h1{font-size:22px;line-height:1.2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
header .brand-text .sub{color:#c9d6f0;font-size:13px;margin-top:3px;}
header .badge-area{text-align:right;}
.badge{background:var(--gold);color:#222;font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px;white-space:nowrap;display:inline-block;}
.badge-note{color:#a8c4f0;font-size:11px;margin-top:4px;}
.wrap{max-width:1200px;margin:0 auto;padding:18px;}

/* 赛程预告 */
.fixture-bar{background:var(--card);border-radius:14px;padding:16px 20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1px solid var(--line);}
.fixture-bar .fixture-title{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.fixture-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.fixture-item:last-child{border-bottom:none;}
.fixture-date{min-width:110px;font-size:12px;color:var(--muted);font-weight:600;}
.fixture-teams{flex:1;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;}
.fixture-teams img{width:24px;height:24px;object-fit:contain;}
.fixture-vs{color:var(--muted);font-size:12px;font-weight:400;}
.fixture-info{font-size:12px;color:var(--muted);text-align:right;}
.fixture-info .comp{color:var(--blue);font-weight:600;}

/* 分栏标题对齐 */
.section-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px;}
.section-header .section-title{font-size:15px;font-weight:700;color:var(--blue);padding-bottom:6px;border-bottom:2px solid var(--blue);display:inline-block;}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
.tab{border:none;background:#fff;padding:7px 16px;border-radius:20px;cursor:pointer;font-size:14px;color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.tab.active{background:var(--blue);color:#fff;}
.count{color:var(--muted);font-size:13px;margin:6px 0 14px;}

/* 左右分栏 */
.layout{display:grid;grid-template-columns:3fr 1fr;gap:18px;align-items:start;}
.news-col{display:flex;flex-direction:column;gap:14px;}
.gallery-col{display:flex;flex-direction:column;gap:14px;}

/* 新闻卡片 */
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1px solid var(--line);transition:box-shadow .15s, transform .15s;}
.card:hover{box-shadow:0 6px 20px rgba(3,70,148,.14);transform:translateY(-2px);}
.card .head{display:flex;gap:14px;padding:14px;align-items:center;cursor:pointer;}
.card .head .thumb{width:110px;height:74px;object-fit:cover;border-radius:8px;background:#e5e9f2;flex-shrink:0;}
.card .head .info{flex:1;min-width:0;}
.card .meta{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px;}
.tag{font-size:10px;font-weight:700;padding:1px 8px;border-radius:9px;letter-spacing:.3px;}
.tag.article{background:#e3ecfb;color:#0a3d91;}
.tag.video{background:#fde8e8;color:#b91c1c;}
.card h3{font-size:15px;font-weight:600;line-height:1.45;color:var(--txt);}
.card .zh-title{font-size:13px;color:#0a3d91;line-height:1.5;margin-top:2px;}
.card .chev{color:var(--muted);font-size:18px;flex-shrink:0;transition:transform .2s;}
.card.open .chev{transform:rotate(90deg);}

/* 详情区 */
.detail{display:none;border-top:1px solid var(--line);padding:18px 20px;background:#fbfcfe;}
.card.open .detail{display:block;}
.detail-hero{width:100%;border-radius:10px;margin-bottom:16px;background:#e5e9f2;object-fit:contain;max-height:none;}
.lang-switch{display:flex;gap:6px;margin-bottom:14px;}
.lang-switch button{border:1px solid var(--line);background:#fff;padding:4px 14px;border-radius:16px;font-size:12px;cursor:pointer;color:var(--txt);transition:all .15s;}
.lang-switch button.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.article-body{display:none;font-size:15px;line-height:2;color:#2a3242;}
.article-body.show{display:block;}
.article-body.zh{color:#1f2937;}
.article-body.en{color:#3a4356;}
.article-body p{margin-bottom:14px;}
.no-body{color:var(--muted);font-size:13px;}

/* 视频封面（点击跳转官方） */
.video-hero{position:relative;width:100%;border-radius:10px;overflow:hidden;margin-bottom:16px;background:#000;cursor:pointer;}
.video-hero img{width:100%;display:block;object-fit:cover;max-height:320px;}
.video-hero .play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);transition:background .2s;}
.video-hero:hover .play-overlay{background:rgba(0,0,0,.5);}
.video-hero .play-icon{width:64px;height:64px;background:rgba(255,255,255,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;}
.video-hero .duration{position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:2px 8px;border-radius:4px;}

/* 更多按钮 */
.load-more{text-align:center;margin-top:14px;}
.load-more button{background:var(--blue);color:#fff;border:none;padding:10px 28px;border-radius:20px;font-size:14px;cursor:pointer;font-weight:600;transition:background .15s;}
.load-more button:hover{background:#023a7a;}

/* 图集列 */
.gallery-card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1px solid var(--line);}
.gallery-card .head{padding:12px;cursor:pointer;}
.gallery-card .head .thumb{width:100%;height:110px;object-fit:cover;border-radius:8px;background:#e5e9f2;display:block;}
.gallery-card .head .info{padding:8px 2px 2px;}
.gallery-card h3{font-size:13px;font-weight:600;line-height:1.4;}
.gallery-card .zh-title{font-size:12px;color:#0a3d91;line-height:1.45;margin-top:2px;}
.gallery-card .meta{font-size:10px;color:var(--muted);margin-bottom:4px;}
.gallery-grid{display:none;grid-template-columns:repeat(2,1fr);gap:6px;padding:0 12px 12px;}
.gallery-card.open .gallery-grid{display:grid;}
.gallery-grid img{width:100%;border-radius:6px;background:#e5e9f2;cursor:zoom-in;aspect-ratio:1/1;object-fit:cover;}

/* 赞助商 */
.sponsors-section{background:var(--card);border-radius:14px;padding:24px 20px;margin-top:22px;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1px solid var(--line);}
.sponsors-section h2{font-size:15px;font-weight:700;color:var(--blue);margin-bottom:16px;text-align:center;}
.sponsor-tier{margin-bottom:20px;}
.sponsor-tier h3{font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;}
.sponsor-logos{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:20px;}
.sponsor-logos img{height:32px;width:auto;object-fit:contain;filter:grayscale(30%);transition:filter .2s;}
.sponsor-logos img:hover{filter:grayscale(0%);}

/* 灯箱 */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:99;align-items:center;justify-content:center;flex-direction:column;}
.lightbox.show{display:flex;}
.lightbox img{max-width:92vw;max-height:84vh;border-radius:6px;}
.lightbox .lb-close{position:absolute;top:14px;right:22px;color:#fff;font-size:34px;cursor:pointer;}
.lightbox .lb-count{color:#ccc;margin-top:10px;font-size:13px;}

footer{text-align:center;color:var(--muted);font-size:12px;padding:22px;border-top:1px solid #e5e9f2;margin-top:22px;}
footer a{color:var(--blue);}

@media (max-width:820px){
  .layout{grid-template-columns:1fr;}
  .fixture-item{flex-direction:column;align-items:flex-start;gap:4px;}
  .fixture-info{text-align:left;}
}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">
      <div class="crest">
        <img src="https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg" alt="Chelsea FC">
      </div>
      <div class="brand-text">

        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Pegasus_Airlines_logo.svg/200px-Pegasus_Airlines_logo.svg.png" alt="Pegasus Airlines" style="height:20px;">

<footer>
數據源：chelseafc.com 官方 · 中英翻譯由免費接口提供 · 圖片版權歸車路士足球會所有，僅作個人收藏
</footer>

<div class="lightbox" id="lightbox" onclick="closeLB()">
  <span class="lb-close">×</span>
  <img id="lb-img" src="" alt="">
  <div class="lb-count" id="lb-count"></div>
</div>

<script>
let DATA = {news:[]};
let FILTER = 'all';
let DISPLAY_LIMIT = 10;
let ALL_ITEMS = [];

// 球队名称中文映射
const TEAM_ZH = {
  'Chelsea':'車路士','Fulham':'富咸','Luton Town':'盧頓','Brighton & Hove Albion':'白禮頓',
  'Arsenal':'阿仙奴','Hull City':'侯城','Brentford':'賓福特','Bournemouth':'般尼茅夫',
  'Everton':'愛華頓','Tottenham Hotspur':'熱刺','Manchester United':'曼聯','Sunderland':'新特蘭',
  'Leeds United':'列斯聯','Nottingham Forest':'諾定咸森林','Crystal Palace':'水晶宮',
  'Liverpool':'利物浦','Manchester City':'曼城','Aston Villa':'阿士東維拉','Coventry City':'高雲地利',
  'Ipswich Town':'葉士域治','Newcastle United':'紐卡素'
};
const COMP_ZH = {
  'Premier League':'英超','Carabao Cup':'英聯盃','FA Cup':'足總盃','Champions League':'歐聯',
  'Europa League':'歐霸','Conference League':'歐協聯','Club World Cup':'世冠盃'
};

// 加载赛程
fetch('https://www.chelseafc.com/en/api/fixtures/upcoming?pageId=30EGwHPO9uwBCc75RQY6kg&seasonId=SZnXY0nlLjz5ARHlc4CS5')
  .then(r=>r.json())
  .then(d=>{
    const list = document.getElementById('fixture-list');
    let html = '';
    let count = 0;
    for(const month of d.items||[]){
      for(const match of month.items||[]){
        if(count>=3) break;
        const m = match.matchUp;
        const home = m.home.clubName;
        const away = m.away.clubName;
        const homeZh = TEAM_ZH[home]||home;
        const awayZh = TEAM_ZH[away]||away;
        const comp = COMP_ZH[match.competition]||match.competition;
        const isHome = m.isHomeFixture;
        
        // 转换北京时间 (UTC+8)
        const dateStr = match.kickoffDate||'';
        const timeStr = match.kickoffTime||'';
        let bjTime = '';
        try{
          const parts = dateStr.replace('Mon ','').replace('Tue ','').replace('Wed ','').replace('Thu ','').replace('Fri ','').replace('Sat ','').replace('Sun ','').split(' ');
          const day = parts[0];
          const monMap = {'Jan':'01','Feb':'02','Mar':'03','Apr':'04','May':'05','Jun':'06','Jul':'07','Aug':'08','Sept':'09','Oct':'10','Nov':'11','Dec':'12'};
          const mon = monMap[parts[1]]||parts[1];
          const yr = parts[2];
          const [h,mins] = timeStr.split(':');
          const utcDate = new Date(`${yr}-${mon}-${day}T${h}:${mins}:00Z`);
          const bj = new Date(utcDate.getTime() + 8*60*60*1000);
          const bjMon = String(bj.getMonth()+1).padStart(2,'0');
          const bjDay = String(bj.getDate()).padStart(2,'0');
          const bjH = String(bj.getHours()).padStart(2,'0');
          const bjMin = String(bj.getMinutes()).padStart(2,'0');
          bjTime = `${bjMon}月${bjDay}日 ${bjH}:${bjMin}`;
        }catch(e){ bjTime = dateStr+' '+timeStr; }
        
        html += `<div class="fixture-item">
          <div class="fixture-date">${bjTime}</div>
          <div class="fixture-teams">
            <img src="${m.home.clubCrestUrl}" alt="${home}">
            <span>${isHome?homeZh:awayZh}</span>
            <span class="fixture-vs">vs</span>
            <span>${isHome?awayZh:homeZh}</span>
            <img src="${m.away.clubCrestUrl}" alt="${away}">
          </div>
          <div class="fixture-info">
            <div class="comp">${comp}</div>
            <div>${isHome?'主場':'作客'} · ${match.venue||''}</div>
          </div>
        </div>`;
        count++;
      }
      if(count>=3) break;
    }
    list.innerHTML = html || '<p style="color:var(--muted);font-size:13px">暫無賽程</p>';
  })
  .catch(e=>{ document.getElementById('fixture-list').innerHTML = '<p style="color:var(--muted);font-size:13px">賽程載入失敗</p>'; });

// 加载新闻
fetch('data/news.json')
  .then(r=>r.json())
  .then(d=>{
    DATA = d;
    const t = new Date(d.updated.replace(' ','T') + (d.updated.includes('+')?'':'+08:00'));
    const bj = t.toLocaleString('zh-Hant', {timeZone:'Asia/Shanghai', hour12:false});
    document.getElementById('updated').textContent = '更新於 ' + bj;
    render();
  })
  .catch(e=>{ document.getElementById('news-col').innerHTML = '<p>載入失敗：' + e + '</p>'; });

document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  FILTER = btn.dataset.f;
  DISPLAY_LIMIT = 10;
  render();
});

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function toParagraphs(text){
  if(!text) return '';
  const sentences = text.split(/(?<=[。！？.!?])\s*/);
  let html = '', buf = '';
  for(const s of sentences){
    buf += s;
    if(buf.length > 90){
      html += '<p>' + esc(buf.trim()) + '</p>';
      buf = '';
    }
  }
  if(buf.trim()) html += '<p>' + esc(buf.trim()) + '</p>';
  return html;
}

function render(){
  const newsList = DATA.news.filter(n=> n.type.toLowerCase()==='article');
  const videoList = DATA.news.filter(n=> n.type.toLowerCase()==='video');
  const galleryList = DATA.news.filter(n=> n.is_gallery);

  let showNews = FILTER==='all' || FILTER==='article';
  let showVideo = FILTER==='all' || FILTER==='video';

  ALL_ITEMS = [...(showNews?newsList:[]), ...(showVideo?videoList:[])];
  const total = ALL_ITEMS.length;
  const showing = Math.min(DISPLAY_LIMIT, total);
  
  document.getElementById('count').textContent = `顯示 ${showing}/${total} 條 · 點擊卡片展開全文 · 默認顯示中文`;
  document.getElementById('load-more').style.display = total > DISPLAY_LIMIT ? 'block' : 'none';

  const newsCol = document.getElementById('news-col');
  let newsHtml = '';
  const displayItems = ALL_ITEMS.slice(0, DISPLAY_LIMIT);
  
  displayItems.forEach((n,i)=>{
    const thumb = n.thumbnail ? `<img class="thumb" src="${esc(n.thumbnail)}" loading="lazy" alt="">` : '';
    const tag = n.type.toLowerCase()==='video' ? '<span class="tag video">🎬 影片</span>' : '<span class="tag article">📰 新聞</span>';
    const cat = n.category ? `<span>${esc(n.category)}</span>` : '';
    const zhTitle = n.title_zh ? `<div class="zh-title">${esc(n.title_zh)}</div>` : '';

    // 展开后大图 - 使用原始尺寸（去掉 Cloudinary 压缩参数）
    let rawThumb = n.thumbnail || '';
    if(rawThumb.includes('cloudinary.com')){
      // 去掉 w_1200,q_auto,f_auto 等参数，保留原始图
      rawThumb = rawThumb.replace(/w_\d+,/g,'').replace(/q_auto,?/g,'').replace(/f_auto,?/g,'').replace(/c_fill,?/g,'').replace(/h_\d+,/g,'');
      // 清理可能残留的双斜杠或多余逗号
      rawThumb = rawThumb.replace(/,+/g,',').replace(/,$/,'').replace('/,','/');
    }
    const heroImg = rawThumb ? `<img class="detail-hero" src="${esc(rawThumb)}" loading="lazy" alt="">` : '';

    let bodyHtml = '';
    if(n.type.toLowerCase()==='video'){
      // 视频：点击封面跳转到官方视频页
      bodyHtml = `<div class="video-hero" onclick="window.open('${esc(n.url||'')}', '_blank')">
        <img src="${esc(n.thumbnail || '')}" loading="lazy" alt="">
        <div class="play-overlay"><div class="play-icon">▶</div></div>
        <div class="duration">🎬 點擊前往官方頁面觀看</div>
      </div>`;
    } else {
      if(n.body_en || n.body_zh){
        const hasBoth = n.body_en && n.body_zh;
        const switcher = hasBoth ? `<div class="lang-switch">
          <button class="active" data-langbtn="zh" onclick="setLang('${i}','zh','main')">中文</button>
          <button data-langbtn="en" onclick="setLang('${i}','en','main')">English</button>
        </div>` : '';
        const zh = n.body_zh ? `<div class="article-body zh show">${toParagraphs(n.body_zh)}</div>` : `<div class="article-body zh show"><div class="no-body">（暫無中文）</div></div>`;
        const en = n.body_en ? `<div class="article-body en">${toParagraphs(n.body_en)}</div>` : '';
        bodyHtml = switcher + zh + en;
      } else {
        bodyHtml = `<div class="no-body">（本篇僅有標題，無正文內容）</div>`;
      }
    }

    newsHtml += `<div class="card" id="main-${i}">
      <div class="head" onclick="toggle('main-${i}')">
        ${thumb}
        <div class="info">
          <div class="meta">${tag}${cat}</div>
          <h3>${esc(n.title)}</h3>
          ${zhTitle}
        </div>
        <div class="chev">▶</div>
      </div>
      <div class="detail">
        ${heroImg}
        ${bodyHtml}
      </div>
    </div>`;
  });
  newsCol.innerHTML = newsHtml || '<p style="color:var(--muted)">暫無內容</p>';

  // 图集列（不受筛选影响，始终显示）
  const galleryCol = document.getElementById('gallery-col');
  let galleryHtml = '';
  if(galleryList.length){
    galleryList.forEach((n,i)=>{
      const thumb = n.thumbnail ? n.thumbnail : (n.images_local && n.images_local.length ? n.images_local[0] : '');
      const zhTitle = n.title_zh ? `<div class="zh-title">${esc(n.title_zh)}</div>` : '';
      const imgs = (n.images_local||[]).map(p=>`<img src="${esc(p)}" loading="lazy" onclick="openLB('${esc(p)}','${n.images_local.length}')" alt="">`).join('');
      galleryHtml += `<div class="gallery-card" id="gal-${i}">
        <div class="head" onclick="toggle('gal-${i}')">
          ${thumb?`<img class="thumb" src="${esc(thumb)}" loading="lazy" alt="">`:''}
          <div class="info">
            <div class="meta">📷 圖集 · ${n.images_local.length} 張</div>
            <h3>${esc(n.title)}</h3>
            ${zhTitle}
          </div>
        </div>
        <div class="gallery-grid">${imgs}</div>
      </div>`;
    });
  } else {
    galleryHtml = '<p style="color:var(--muted);font-size:13px">暫無圖集</p>';
  }
  galleryCol.innerHTML = galleryHtml;
}

function showMore(){
  DISPLAY_LIMIT += 10;
  render();
}

function toggle(id){
  const el = document.getElementById(id);
  if(el) el.classList.toggle('open');
}

function setLang(key, lang, col){
  const prefix = col==='main' ? 'main-' : 'gal-';
  const card = document.getElementById(prefix+key);
  if(!card) return;
  const bodies = card.querySelectorAll('.article-body');
  bodies.forEach(b=>{
    b.classList.toggle('show', b.classList.contains(lang));
  });
  const btns = card.querySelectorAll('.lang-switch button');
  btns.forEach(b=>{
    b.classList.toggle('active', b.dataset.langbtn===lang);
  });
}

function openLB(src, total){
  document.getElementById('lb-img').src = src;
  document.getElementById('lb-count').textContent = '共 ' + total + ' 張，點擊任意處關閉';
  document.getElementById('lightbox').classList.add('show');
}
function closeLB(){
  document.getElementById('lightbox').classList.remove('show');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLB(); });
</script>
</body>
</html>
