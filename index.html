<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車路士情報站 · Chelsea Blues Hub</title>
<style>
:root{--blue:#034694;--gold:#dba111;--bg:#f4f6fb;--card:#fff;--txt:#1a2233;--muted:#6b7280;--line:#e5e9f2;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;}
header{background:linear-gradient(135deg,#034694 0%,#0a2a6b 60%,#123c8f 100%);color:#fff;padding:32px 20px;text-align:center;}
header .crest{font-size:42px;}
header h1{font-size:26px;margin:8px 0 4px;}
header .sub{color:#c9d6f0;font-size:14px;}
.badge{display:inline-block;background:var(--gold);color:#222;font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;margin:8px 0;}
.wrap{max-width:1000px;margin:0 auto;padding:20px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;}
.tab{border:none;background:#fff;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:14px;color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.tab.active{background:var(--blue);color:#fff;}
.count{color:var(--muted);font-size:13px;margin:8px 0 16px;}
.grid{display:grid;grid-template-columns:1fr;gap:14px;}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:box-shadow .15s;}
.card:hover{box-shadow:0 4px 16px rgba(3,70,148,.14);}
.card .head{display:flex;gap:14px;padding:14px;align-items:flex-start;}
.card .head .thumb{width:150px;height:100px;object-fit:cover;border-radius:8px;background:#e5e9f2;flex-shrink:0;}
.card .head .info{flex:1;min-width:0;}
.card .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;}
.tag.gallery{background:#fef3d8;color:#a97100;}
.tag.article{background:#e3ecfb;color:#0a3d91;}
.tag.video{background:#fde8e8;color:#b91c1c;}
.card h3{font-size:16px;font-weight:600;line-height:1.4;color:var(--txt);margin-bottom:4px;}
.card .zh-title{font-size:14px;color:#0a3d91;line-height:1.5;}
.card .chev{color:var(--muted);font-size:20px;align-self:center;transition:transform .2s;flex-shrink:0;}
.card.open .chev{transform:rotate(90deg);}
/* 详情区 */
.detail{display:none;border-top:1px solid var(--line);padding:16px;background:#fafbfe;}
.card.open .detail{display:block;}
.lang-switch{display:flex;gap:6px;margin-bottom:12px;}
.lang-switch button{border:1px solid var(--line);background:#fff;padding:4px 14px;border-radius:16px;font-size:12px;cursor:pointer;color:var(--txt);}
.lang-switch button.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.article-body{font-size:14px;line-height:1.8;color:#333;white-space:pre-wrap;}
.article-body.zh{color:#0a3d91;}
.article-body.en{color:#444;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:12px;}
.gallery-grid img{width:100%;border-radius:6px;background:#e5e9f2;cursor:zoom-in;}
.loading{color:var(--muted);font-size:13px;padding:10px 0;}
.no-body{color:var(--muted);font-size:13px;}
/* 灯箱 */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99;align-items:center;justify-content:center;flex-direction:column;}
.lightbox.show{display:flex;}
.lightbox img{max-width:92vw;max-height:82vh;border-radius:6px;}
.lightbox .lb-close{position:absolute;top:16px;right:20px;color:#fff;font-size:32px;cursor:pointer;}
.lightbox .lb-count{color:#ccc;margin-top:10px;font-size:13px;}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px;border-top:1px solid #e5e9f2;margin-top:24px;}
footer a{color:var(--blue);}
</style>
</head>
<body>
<header>
<div class="crest">🔵</div>
<h1>車路士情報站 · Chelsea Blues Hub</h1>
<div class="sub">官方新聞 + 訓練圖集 · 中英對照 · 自動更新</div>
<div class="badge" id="updated"></div>
</header>
<div class="wrap">
<div class="tabs" id="tabs">
  <button class="tab active" data-f="all">全部</button>
  <button class="tab" data-f="gallery">📷 圖集</button>
  <button class="tab" data-f="article">📰 新聞</button>
  <button class="tab" data-f="video">🎬 影片</button>
</div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
</div>
<footer>
數據源：chelseafc.com 官方 · 中英翻譯由免費接口提供 · 圖片版權歸車路士足球會所有，僅作個人收藏
</footer>

<div class="lightbox" id="lightbox" onclick="closeLB()">
  <span class="lb-close">×</span>
  <img id="lb-img" src="" alt="">
  <div class="lb-count" id="lb-count"></div>
</div>

<script>
let DATA = {news:[]};
let FILTER = 'all';
let LANG = 'zh';

fetch('data/news.json')
  .then(r=>r.json())
  .then(d=>{
    DATA = d;
    document.getElementById('updated').textContent = '更新於 ' + d.updated.replace('T',' ');
    render();
  })
  .catch(e=>{ document.getElementById('grid').innerHTML = '<p>載入失敗：' + e + '</p>'; });

document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  FILTER = btn.dataset.f;
  render();
});

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){
  const list = DATA.news.filter(n=> FILTER==='all' || (FILTER==='gallery'? n.is_gallery : n.type.toLowerCase()===FILTER));
  document.getElementById('count').textContent = `共 ${list.length} 條 · 點擊卡片站內查看全文`;
  const grid = document.getElementById('grid');
  grid.innerHTML = list.map((n,i)=>{
    const thumb = n.thumbnail ? `<img class="thumb" src="${esc(n.thumbnail)}" loading="lazy" alt="">` : '';
    const tag = n.is_gallery ? '<span class="tag gallery">📷 圖集</span>' : `<span class="tag ${n.type.toLowerCase()}">${esc(n.type)}</span>`;
    const cat = n.category ? `<span>${esc(n.category)}</span>` : '';
    const zhTitle = n.title_zh ? `<div class="zh-title">${esc(n.title_zh)}</div>` : '';

    // 正文区
    let bodyHtml = '';
    if(n.body_en || n.body_zh){
      const en = n.body_en ? `<div class="article-body en" data-lang="en">${esc(n.body_en)}</div>` : '';
      const zh = n.body_zh ? `<div class="article-body zh" data-lang="zh">${esc(n.body_zh)}</div>` : '';
      const hasBoth = n.body_en && n.body_zh;
      const switcher = hasBoth ? `<div class="lang-switch">
        <button class="${LANG==='zh'?'active':''}" data-langbtn="zh" onclick="setLang(${i},'zh')">中文</button>
        <button class="${LANG==='en'?'active':''}" data-langbtn="en" onclick="setLang(${i},'en')">English</button>
      </div>` : '';
      bodyHtml = switcher + en + zh;
    } else {
      bodyHtml = `<div class="no-body">（本篇僅有標題，無正文內容）</div>`;
    }

    // 图集
    let galleryHtml = '';
    if(n.is_gallery && n.images_local && n.images_local.length){
      const imgs = n.images_local.map(p=>`<img src="${esc(p)}" loading="lazy" onclick="openLB('${esc(p)}','${n.images_local.length}')" alt="">`).join('');
      galleryHtml = `<div class="gallery-grid">${imgs}</div>`;
    }

    return `<div class="card" id="card-${i}">
      <div class="head" onclick="toggle(${i})">
        ${thumb}
        <div class="info">
          <div class="meta">${tag}${cat}</div>
          <h3>${esc(n.title)}</h3>
          ${zhTitle}
        </div>
        <div class="chev">▶</div>
      </div>
      <div class="detail" id="detail-${i}">
        ${galleryHtml ? galleryHtml + (bodyHtml.includes('article-body')?'<div style="height:12px"></div>':'') : ''}
        ${bodyHtml}
      </div>
    </div>`;
  }).join('');
}

function toggle(i){
  const card = document.getElementById('card-'+i);
  card.classList.toggle('open');
}

function setLang(i, lang){
  LANG = lang;
  const card = document.getElementById('card-'+i);
  const bodies = card.querySelectorAll('.article-body');
  bodies.forEach(b=>{
    b.style.display = (b.dataset.lang===lang) ? 'block' : 'none';
  });
  const btns = card.querySelectorAll('.lang-switch button');
  btns.forEach(b=>{
    b.classList.toggle('active', b.dataset.langbtn===lang);
  });
}

// 灯箱
function openLB(src, total){
  document.getElementById('lb-img').src = src;
  document.getElementById('lb-count').textContent = '共 ' + total + ' 張，點擊任意處關閉';
  document.getElementById('lightbox').classList.add('show');
}
function closeLB(){
  document.getElementById('lightbox').classList.remove('show');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLB(); });
</script>
</body>
</html>
